[package]
name = "ream-mcp-core"
version = "0.1.24"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure Rust core for Ream MCP — chunker, store, search, embeddings, traceability."

[lib]
crate-type = ["lib"]

[dependencies]
# SQLite via bundled sqlite3 + FTS5; `blob` feature for raw embedding storage.
rusqlite = { version = "0.40", features = ["bundled", "blob"] }
# Vector accelerator. ALPHA (0.1.10-alpha.3) — the BM25-only fallback is the
# load-bearing path. Statically linked via `cc`, no runtime .so/.dll needed.
sqlite-vec = "0.1"
# Markdown AST walker.
pulldown-cmark = { version = "0.13", default-features = false }
# Embeddings via ONNX runtime + BAAI/bge-small-en-v1.5.
#
# `default-features = false` and no `hf-hub-*` feature: this crate links no
# HTTP client and never fetches the model. The files are downloaded once, on
# purpose, by `ream-mcp-reindex --download-model`, pinned by SHA-256 in
# `embeddings.rs`, and loaded from disk through fastembed's user-defined model
# API after the same check. fastembed's defaults would also pull native-tls,
# whose shared libssl the published `.node` must not need.
#
# `ort-load-dynamic` replaces `ort-download-binaries`: linking a prebuilt ONNX
# at build time is the thing that was deliberately avoided.
fastembed = { version = "6", default-features = false, features = [
    "ort-load-dynamic",
    "image-models",
] }
# Force `ort` (pulled by fastembed) to load ONNX Runtime dynamically at runtime
# rather than linking a prebuilt at build time. `ort` ships no prebuilt for some
# targets (e.g. x86_64-apple-darwin under cross-compile), which breaks the NAPI
# build there. The library is loaded from the absolute path ORT_DYLIB_PATH
# names, through `ort::init_from`, never from the loader's search path.
# Pinned exactly, and to the same release fastembed resolves: `ort` is
# pre-1.0, so a caret range would let a release candidate change under us, and
# the two crates disagreeing on it is a link error rather than a type error.
ort = { version = "=2.0.0-rc.13", features = ["load-dynamic"] }
# SHA-256 for stable chunk ids and the pinned model files.
sha2 = "0.11"
# Filesystem walker for the corpus + traceability scanner.
walkdir = "2"
# Lazy init of the embeddings model.
once_cell = "1"
# Structured errors.
thiserror = "2"
# JSON shape for NAPI bridge payloads.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Async runtime — embeddings + indexer run in `spawn_blocking` from the NAPI
# layer; we only need the runtime + sync primitives here.
tokio = { version = "1", features = ["rt", "sync", "macros"] }

[dev-dependencies]
tempfile = "3"
